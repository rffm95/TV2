<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cheers O Bar - BOA SORTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050914;
      --bg2:#0a1631;
      --gold:#ffd300;
      --red:#e21b4d;
      --blue:#223971;
      --blue2:#17305f;
      --text:#f4f7ff;
      --muted:#b9c3de;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.08);
    }

    *{
      box-sizing:border-box;
      user-select:none;
      -webkit-user-select:none;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    body{
      font-family:'Rajdhani',sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,211,0,.10), transparent 20%),
        radial-gradient(circle at 15% 20%, rgba(226,27,77,.10), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(34,57,113,.20), transparent 30%),
        linear-gradient(180deg, #02050b 0%, #07101d 55%, #03060d 100%);
      cursor:none;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:14px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:14px;
    }

    .topbar,
    .left-panel,
    .footerbar{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 18px;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:54px;
      height:54px;
      border-radius:50%;
      position:relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,211,0,.95) 0 30%, transparent 31%),
        linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.14);
      flex:0 0 auto;
    }

    .mark::before,
    .mark::after{
      content:"";
      position:absolute;
      top:21px;
      width:17px;
      height:11px;
      background:var(--red);
      border-radius:18px 18px 4px 4px;
    }

    .mark::before{
      left:10px;
      transform:rotate(18deg);
    }

    .mark::after{
      right:10px;
      transform:rotate(-18deg);
    }

    .title small,
    .footerbar{
      display:block;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--muted);
      font-size:12px;
    }

    .title strong,
    .cta{
      display:block;
      font-family:'Oxanium',sans-serif;
      text-transform:uppercase;
      line-height:1;
    }

    .title strong{
      font-size:clamp(24px, 1.8vw, 34px);
      letter-spacing:.04em;
    }

    .cta{
      font-size:clamp(22px, 1.8vw, 34px);
      text-align:right;
      white-space:nowrap;
    }

    .main{
      min-height:0;
      display:grid;
      grid-template-columns:300px 1fr;
      gap:18px;
    }

    .left-panel{
      padding:20px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .panel-title{
      margin:0 0 14px;
      font-size:15px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.18em;
    }

    .prize-list{
      display:grid;
      gap:10px;
    }

    .prize-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.05);
      font-size:24px;
      font-weight:700;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      flex:0 0 auto;
    }

    .arena{
      min-height:0;
      border-radius:34px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }

    .wheel-stage{
      position:relative;
      width:min(80vh, 76vw, 1200px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .pointer{
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:34px solid transparent;
      border-right:34px solid transparent;
      border-top:86px solid var(--gold);
      z-index:5;
    }

    .pointer::after{
      content:"";
      position:absolute;
      left:-12px;
      top:-86px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#fff7d2;
    }

    .wheel-wrap{
      position:relative;
      width:100%;
      height:100%;
      border-radius:50%;
      padding:14px;
      background:linear-gradient(135deg, #f3f5fb, #c8d0df 35%, #f4d66a 55%, #f2f5fb 100%);
    }

    .wheel{
      position:relative;
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      transform:translateZ(0);
      will-change:transform;
      backface-visibility:hidden;
      transition:transform 5.8s cubic-bezier(.12,.82,.18,1);
    }

    .label{
      position:absolute;
      inset:0;
      transform-origin:50% 50%;
      pointer-events:none;
    }

    .label span{
      position:absolute;
      left:50%;
      top:50%;
      width:28%;
      transform-origin:0 0;
      color:#fff;
      font-family:'Oxanium',sans-serif;
      font-weight:800;
      font-size:clamp(11px, 1.1vh, 19px);
      line-height:1.02;
      text-transform:uppercase;
      text-align:center;
      letter-spacing:.03em;
      text-shadow:0 1px 3px rgba(0,0,0,.45);
    }

    .hub{
      position:absolute;
      width:18%;
      aspect-ratio:1;
      border-radius:50%;
      background:linear-gradient(180deg, #fff2b3 0%, #dfb100 45%, #9b7300 100%);
      display:grid;
      place-items:center;
      z-index:4;
      border:6px solid rgba(255,255,255,.16);
    }

    .hub::after{
      content:"CHEERS";
      font-family:'Oxanium',sans-serif;
      font-size:clamp(14px, 1vw, 22px);
      font-weight:800;
      letter-spacing:.15em;
      color:#2e1d00;
    }

    .footerbar{
      padding:12px 16px;
      text-align:center;
    }

    @media (max-width: 1200px){
      .main{
        grid-template-columns:260px 1fr;
      }
    }

    @media (max-width: 980px){
      .topbar{
        flex-direction:column;
        text-align:center;
      }

      .brand{
        justify-content:center;
      }

      .cta{
        text-align:center;
        white-space:normal;
      }

      .main{
        grid-template-columns:1fr;
      }

      .wheel-stage{
        width:min(76vw, 70vh, 900px);
      }
    }

    @media (max-width: 760px){
      body{
        cursor:default;
      }

      html,body{
        overflow:auto;
      }

      .app{
        height:auto;
        min-height:100vh;
      }

      .wheel-stage{
        width:min(94vw, 58vh);
      }

      .prize-item{
        font-size:20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="title">
          <small>Cheers O Bar</small>
          <strong>Roleta Red Bull</strong>
        </div>
      </div>
      <div class="cta">Pede pack ou régua e gira</div>
    </header>

    <main class="main">
      <aside class="left-panel">
        <h2 class="panel-title">Prémios</h2>
        <div class="prize-list">
          <div class="prize-item"><span class="dot" style="background:#ffd300"></span><span>5 shots jagger</span></div>
          <div class="prize-item"><span class="dot" style="background:#e21b4d"></span><span>5 finos</span></div>
          <div class="prize-item"><span class="dot" style="background:#4f7fe0"></span><span>1 shot jagger</span></div>
          <div class="prize-item"><span class="dot" style="background:#dfe9ff"></span><span>1 fino</span></div>
          <div class="prize-item"><span class="dot" style="background:#7f8fb8"></span><span>Tenta outra vez</span></div>
        </div>
      </aside>

      <section class="arena">
        <div class="wheel-stage">
          <div class="pointer"></div>

          <div class="wheel-wrap">
            <div class="wheel" id="wheel"></div>
            <div class="hub"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="footerbar">O prémio é o que estiver na seta quando a roleta parar</div>
  </div>

  <script>
    const wheel = document.getElementById('wheel');

    const segments = [
      { label: '5 SHOTS<br>JAGGER', color: '#d4a800' },
      { label: 'TENTA<br>OUTRA<br>VEZ', color: '#16305e' },
      { label: '5<br>FINOS', color: '#e21b4d' },
      { label: 'TENTA<br>OUTRA<br>VEZ', color: '#223971' },
      { label: '1 SHOT<br>JAGGER', color: '#4f7fe0' },
      { label: '1<br>FINO', color: '#6f95ef' },
      { label: 'TENTA<br>OUTRA<br>VEZ', color: '#17305f' }
    ];

    const segmentAngle = 360 / segments.length;
    let spinning = false;
    let totalRotation = 0;

    function norm(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function buildWheel() {
      const gradient = segments.map((seg, i) => {
        const start = i * segmentAngle;
        const end = start + segmentAngle;
        return `${seg.color} ${start}deg ${end}deg`;
      }).join(',');

      wheel.style.background = `conic-gradient(from 0deg, ${gradient})`;
      wheel.innerHTML = '';

      for (let i = 0; i < segments.length; i++) {
        const item = segments[i];

        const label = document.createElement('div');
        label.className = 'label';
        label.style.transform = `rotate(${i * segmentAngle}deg)`;

        const span = document.createElement('span');
        span.innerHTML = item.label;
        span.style.transform = `translate(14%, -50%) rotate(${segmentAngle / 2}deg)`;

        label.appendChild(span);
        wheel.appendChild(label);
      }
    }

    function targetRotationForIndex(index) {
      const current = norm(totalRotation);
      const centerAngle = index * segmentAngle + segmentAngle / 2;
      const target = norm(360 - centerAngle);
      const delta = norm(target - current);
      const extraTurns = (6 + Math.floor(Math.random() * 2)) * 360;
      return totalRotation + extraTurns + delta;
    }

    function spin() {
      if (spinning) return;
      spinning = true;

      const index = Math.floor(Math.random() * segments.length);
      totalRotation = targetRotationForIndex(index);
      wheel.style.transform = `translateZ(0) rotate(${totalRotation}deg)`;
    }

    wheel.addEventListener('transitionend', () => {
      spinning = false;
    });

    buildWheel();

    window.addEventListener('keydown', spin, { passive: true });
    document.addEventListener('mousedown', spin, { passive: true });
    document.addEventListener('touchstart', spin, { passive: true });
  </script>
</body>
</html>
