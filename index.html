<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cheers O Bar - Roleta Red Bull</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070d;
      --bg-2: #0b1430;
      --panel: rgba(10, 18, 38, 0.86);
      --text: #f5f7ff;
      --muted: #bcc5df;
      --gold: #FFD300;
      --red: #E21B4D;
      --blue: #223971;
      --blue-2: #12264f;
      --silver: #d6dcea;
      --ring: rgba(255,255,255,.1);
      --shadow: 0 24px 60px rgba(0,0,0,.48);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      cursor: none !important;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(255,211,0,.16), transparent 22%),
        radial-gradient(circle at 12% 18%, rgba(226,27,77,.18), transparent 24%),
        radial-gradient(circle at 88% 18%, rgba(34,57,113,.35), transparent 28%),
        linear-gradient(180deg, #02040a 0%, #07111f 48%, #04070d 100%);
    }

    .bg-noise,
    .flash,
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .bg-noise {
      opacity: .05;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
    }

    .flash {
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,.22), transparent 55%);
      transition: opacity .25s ease;
    }

    .flash.active {
      opacity: 1;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar,
    .result,
    .prizes,
    .footerbar {
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
      border: 1px solid var(--ring);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .topbar {
      border-radius: 24px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,211,0,.96) 0 30%, transparent 31%),
        linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.14);
      overflow: hidden;
    }

    .mark::before,
    .mark::after {
      content: '';
      position: absolute;
      top: 22px;
      width: 18px;
      height: 12px;
      background: var(--red);
      border-radius: 18px 18px 4px 4px;
    }

    .mark::before {
      left: 10px;
      transform: rotate(18deg);
    }

    .mark::after {
      right: 10px;
      transform: rotate(-18deg);
    }

    .title small,
    .footerbar {
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--muted);
      font-size: 12px;
    }

    .title strong,
    .result-main,
    .cta {
      font-family: 'Oxanium', sans-serif;
      text-transform: uppercase;
    }

    .title strong {
      display: block;
      font-size: clamp(22px, 2vw, 30px);
      letter-spacing: .04em;
    }

    .cta {
      font-size: clamp(18px, 1.8vw, 28px);
      text-align: right;
      line-height: .95;
    }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(420px, 1fr) 280px;
      gap: 18px;
      align-items: center;
    }

    .prizes,
    .result {
      border-radius: 28px;
      padding: 18px;
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 15px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .prize-list {
      display: grid;
      gap: 10px;
    }

    .prize-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.06);
      font-size: 24px;
      font-weight: 700;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 16px currentColor;
      flex: 0 0 auto;
    }

    .arena {
      min-height: 0;
      display: grid;
      place-items: center;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04), transparent 48%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
    }

    .wheel-stage {
      position: relative;
      width: min(72vh, 72vw, 760px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 28px 60px rgba(0,0,0,.6));
    }

    .glow {
      position: absolute;
      inset: 11%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,211,0,.14), transparent 62%);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .pointer-box {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: grid;
      place-items: center;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 34px solid transparent;
      border-right: 34px solid transparent;
      border-top: 88px solid var(--gold);
      filter: drop-shadow(0 7px 14px rgba(0,0,0,.55));
      position: relative;
    }

    .pointer::after {
      content: '';
      position: absolute;
      left: -14px;
      top: -88px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,.14);
    }

    .wheel-shell {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 18px;
      background:
        radial-gradient(circle at 28% 24%, rgba(255,255,255,.24), transparent 18%),
        conic-gradient(from 0deg, #edf2ff, #b7c2db 12%, #ffe89a 22%, #d8a800 35%, #fff0ba 49%, #b7c2db 62%, #eef3ff 76%, #c98f00 88%, #eef3ff 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.75),
        inset 0 -10px 24px rgba(0,0,0,.32),
        0 0 0 6px rgba(255,255,255,.04),
        0 18px 46px rgba(0,0,0,.45);
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 6.8s cubic-bezier(.11,.88,.18,1);
    }

    .wheel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 52%, rgba(0,0,0,.18) 68%, rgba(255,255,255,.08) 78%, transparent 82%),
        repeating-conic-gradient(from 0deg, rgba(255,255,255,.12) 0deg 1deg, transparent 1deg 18deg);
      mix-blend-mode: screen;
      opacity: .55;
    }

    .slice-label {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    .slice-label span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30%;
      transform-origin: 0 0;
      color: #fff;
      font-family: 'Oxanium', sans-serif;
      font-size: clamp(10px, 1.25vh, 15px);
      font-weight: 800;
      line-height: 1.02;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,.56);
      letter-spacing: .03em;
    }

    .hub {
      position: absolute;
      width: 19%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.72), transparent 22%),
        linear-gradient(180deg, #fff2bb 0%, #e2b300 42%, #8a6100 100%);
      border: 8px solid rgba(255,255,255,.14);
      box-shadow:
        inset 0 10px 16px rgba(255,255,255,.32),
        inset 0 -12px 22px rgba(0,0,0,.34),
        0 8px 20px rgba(0,0,0,.35);
      display: grid;
      place-items: center;
      z-index: 14;
    }

    .hub::after {
      content: 'CHEERS';
      font-family: 'Oxanium', sans-serif;
      font-size: clamp(14px, 1.3vw, 20px);
      color: #2b1900;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .lights {
      position: absolute;
      inset: 1.3%;
      border-radius: 50%;
      z-index: 12;
    }

    .bulb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px;
      border-radius: 50%;
      background: #fff3be;
      box-shadow: 0 0 10px rgba(255,244,176,.9), 0 0 22px rgba(255,211,0,.56);
      opacity: .45;
      animation: blink 1.4s linear infinite;
    }

    .result {
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)),
        linear-gradient(135deg, rgba(34,57,113,.24), rgba(226,27,77,.16));
    }

    .result-main {
      min-height: 2.2em;
      display: grid;
      place-items: center;
      font-size: clamp(28px, 3vw, 40px);
      line-height: .94;
      letter-spacing: .03em;
      margin: 8px 0 0;
    }

    .footerbar {
      border-radius: 20px;
      padding: 12px 16px;
      text-align: center;
    }

    .confetti-piece {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
    }

    .spin-pop {
      animation: pop .8s ease-out;
    }

    .jackpot {
      color: var(--gold);
      text-shadow: 0 0 22px rgba(255,211,0,.44);
    }

    @keyframes blink {
      0%, 100% { opacity: .36; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.14); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(.98); opacity: .52; }
      50% { transform: scale(1.03); opacity: .92; }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      30% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes fall {
      0% { opacity: 1; transform: translate3d(0, -12vh, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate3d(var(--drift), 110vh, 0) rotate(var(--rot)); }
    }

    @media (max-width: 1180px) {
      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .brand {
        justify-content: center;
      }

      .cta {
        text-align: center;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .prizes {
        order: 2;
      }

      .result {
        order: 3;
      }

      .wheel-stage {
        width: min(74vw, 72vh, 700px);
      }
    }

    @media (max-width: 760px) {
      * { cursor: default !important; }

      body, html {
        overflow: auto;
      }

      .app {
        min-height: auto;
      }

      .wheel-stage {
        width: min(92vw, 58vh);
      }

      .prize-item {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="flash" id="flash"></div>
  <div class="confetti" id="confetti"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="title">
          <small>Cheers O Bar</small>
          <strong>Roleta Red Bull</strong>
        </div>
      </div>
      <div class="cta">Pede pack ou régua e gira</div>
    </header>

    <main class="main">
      <aside class="prizes">
        <h2 class="panel-title">Prémios</h2>
        <div class="prize-list">
          <div class="prize-item"><span class="dot" style="color:#FFD300;background:#FFD300"></span><span>5 Jägerbombs</span></div>
          <div class="prize-item"><span class="dot" style="color:#ff6e9a;background:#E21B4D"></span><span>5 finos</span></div>
          <div class="prize-item"><span class="dot" style="color:#8cb5ff;background:#8cb5ff"></span><span>2 finos</span></div>
          <div class="prize-item"><span class="dot" style="color:#dfe9ff;background:#dfe9ff"></span><span>1 fino</span></div>
          <div class="prize-item"><span class="dot" style="color:#8b96b6;background:#8b96b6"></span><span>Tenta outra vez</span></div>
        </div>
      </aside>

      <section class="arena">
        <div class="wheel-stage" id="wheelStage">
          <div class="glow"></div>

          <div class="pointer-box">
            <div class="pointer"></div>
          </div>

          <div class="wheel-shell">
            <div class="lights" id="lights"></div>
            <div class="wheel" id="wheel"></div>
            <div class="hub"></div>
          </div>
        </div>
      </section>

      <aside class="result">
        <h2 class="panel-title">Resultado</h2>
        <div class="result-main" id="resultMain">Carrega para girar</div>
      </aside>
    </main>

    <div class="footerbar">Clique, toque ou tecla para girar</div>
  </div>

  <script>
    const wheel = document.getElementById('wheel');
    const lights = document.getElementById('lights');
    const resultMain = document.getElementById('resultMain');
    const flash = document.getElementById('flash');
    const confetti = document.getElementById('confetti');
    const wheelStage = document.getElementById('wheelStage');

    const prizeStyles = {
      '5 JÄGERBOMBS': { color: '#D4A800', text: '5<br>JÄGER<br>BOMBS' },
      '5 FINOS': { color: '#E21B4D', text: '5<br>FINOS' },
      '2 FINOS': { color: '#355FB8', text: '2<br>FINOS' },
      '1 FINO': { color: '#4F7FE0', text: '1<br>FINO' },
      'TENTA OUTRA VEZ': { color: '#16305E', text: 'TENTA<br>OUTRA<br>VEZ' }
    };

    // 20 fatias iguais = probabilidades exatas
    // 1 = 5%, 2 = 10%, 3 = 15%, 5 = 25%, 9 = 45%
    const segments = [
      '5 JÄGERBOMBS',
      'TENTA OUTRA VEZ',
      '1 FINO',
      '5 FINOS',
      'TENTA OUTRA VEZ',
      '2 FINOS',
      'TENTA OUTRA VEZ',
      '1 FINO',
      'TENTA OUTRA VEZ',
      '2 FINOS',
      '1 FINO',
      'TENTA OUTRA VEZ',
      '1 FINO',
      'TENTA OUTRA VEZ',
      '2 FINOS',
      'TENTA OUTRA VEZ',
      '1 FINO',
      '5 FINOS',
      'TENTA OUTRA VEZ',
      'TENTA OUTRA VEZ'
    ];

    const segmentAngle = 360 / segments.length;
    let spinning = false;
    let totalRotation = 0;

    function norm(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function buildWheel() {
      wheel.innerHTML = '';

      const stops = segments.map((label, index) => {
        const start = index * segmentAngle;
        const end = start + segmentAngle;
        return `${prizeStyles[label].color} ${start}deg ${end}deg`;
      }).join(', ');

      wheel.style.background = `conic-gradient(from 0deg, ${stops})`;

      segments.forEach((label, index) => {
        const wrap = document.createElement('div');
        wrap.className = 'slice-label';
        wrap.style.transform = `rotate(${index * segmentAngle}deg)`;

        const span = document.createElement('span');
        span.innerHTML = prizeStyles[label].text;
        span.style.transform = `translate(12%, -50%) rotate(${segmentAngle / 2}deg)`;
        wrap.appendChild(span);
        wheel.appendChild(wrap);
      });
    }

    function buildLights() {
      lights.innerHTML = '';
      const count = 40;

      for (let i = 0; i < count; i++) {
        const bulb = document.createElement('div');
        bulb.className = 'bulb';
        const angle = (360 / count) * i;
        bulb.style.transform = `rotate(${angle}deg) translateY(calc(-50% + -46%))`;
        bulb.style.animationDelay = `${i * 0.04}s`;
        lights.appendChild(bulb);
      }
    }

    function randomIndex() {
      return Math.floor(Math.random() * segments.length);
    }

    function targetRotationForIndex(index) {
      const current = norm(totalRotation);
      const centerAngle = index * segmentAngle + segmentAngle / 2;
      const targetMod = norm(360 - centerAngle);
      const delta = norm(targetMod - current);
      const extraTurns = (8 + Math.floor(Math.random() * 3)) * 360;
      return totalRotation + extraTurns + delta;
    }

    function landedIndexFromRotation(rotation) {
      const rotationNorm = norm(rotation);
      const pointerWorldAngle = norm(360 - rotationNorm);
      let rawIndex = Math.floor(pointerWorldAngle / segmentAngle);

      if (rawIndex < 0) rawIndex = 0;
      if (rawIndex >= segments.length) rawIndex = segments.length - 1;

      return rawIndex;
    }

    function burst(jackpot = false) {
      confetti.innerHTML = '';
      const total = jackpot ? 130 : 50;
      const palette = jackpot
        ? ['#FFD300', '#fff0bd', '#E21B4D', '#ffffff']
        : ['#E21B4D', '#FFD300', '#dfe9ff', '#8b96b6'];

      for (let i = 0; i < total; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';

        const size = 6 + Math.random() * (jackpot ? 12 : 7);
        piece.style.width = `${size}px`;
        piece.style.height = `${size * (1.3 + Math.random())}px`;
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.top = '-10vh';
        piece.style.background = palette[Math.floor(Math.random() * palette.length)];
        piece.style.setProperty('--drift', `${-180 + Math.random() * 360}px`);
        piece.style.setProperty('--rot', `${220 + Math.random() * 720}deg`);
        piece.style.animation = `fall ${jackpot ? 2.8 : 2.1}s cubic-bezier(.12,.8,.2,1) forwards`;
        piece.style.opacity = '1';
        confetti.appendChild(piece);
      }

      setTimeout(() => {
        confetti.innerHTML = '';
      }, jackpot ? 3200 : 2400);
    }

    function showResult(label) {
      resultMain.classList.remove('jackpot');

      if (label === '5 JÄGERBOMBS') {
        resultMain.textContent = 'JACKPOT · 5 JÄGERBOMBS';
        resultMain.classList.add('jackpot');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 220);
        burst(true);
        return;
      }

      resultMain.textContent = label;

      if (label === '5 FINOS' || label === '2 FINOS') {
        burst(false);
      }
    }

    function spin() {
      if (spinning) return;
      spinning = true;

      wheelStage.classList.add('spin-pop');
      setTimeout(() => wheelStage.classList.remove('spin-pop'), 800);

      const chosenIndex = randomIndex();
      totalRotation = targetRotationForIndex(chosenIndex);

      resultMain.classList.remove('jackpot');
      resultMain.textContent = 'A GIRAR...';
      wheel.style.transform = `rotate(${totalRotation}deg)`;
    }

    wheel.addEventListener('transitionend', () => {
      if (!spinning) return;

      const landedIndex = landedIndexFromRotation(totalRotation);
      const landedPrize = segments[landedIndex];

      showResult(landedPrize);
      spinning = false;
    });

    buildWheel();
    buildLights();

    window.addEventListener('keydown', spin);
    document.addEventListener('mousedown', spin);
    document.addEventListener('touchstart', spin, { passive: true });
  </script>
</body>
</html>
